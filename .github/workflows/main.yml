name: Auto YouTube Shorts Generator

on:
  workflow_dispatch: # यह आपको मैन्युअल 'Run workflow' का बटन देगा
  schedule:
    - cron: '0 4 * * *' # यह मशीन को रोज़ ऑटोमैटिक चलाएगा

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (ImageMagick & Fonts)
      run: |
        sudo apt-get update -y
        sudo apt-get install -y imagemagick fonts-indic fonts-noto-core
        sudo rm -f /etc/ImageMagick-6/policy.xml
        sudo rm -f /etc/ImageMagick-7/policy.xml

    - name: Install Python Libraries
      run: |
        pip install requests edge-tts moviepy==1.0.3 pillow google-api-python-client google-auth-oauthlib google-auth-httplib2

    - name: Run Video Generator Script
      env:
        # 🛑 यहाँ हमने नई Groq चाबी को अंदर जाने का रास्ता दे दिया है
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        
        # यूट्यूब अपलोड करने वाली पुरानी चाबियां
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_REFRESH_TOKEN_MYSTIC: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTIC }}
      run: python main.py
