name: Auto YouTube Shorts Uploader V5

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install ImageMagick & Fix Policy
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick
        sudo sed -i 's/pattern="@\*"/pattern="\*"/g' /etc/ImageMagick-6/policy.xml

    - name: Auto-Update & Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade requests edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 google-genai Pillow==9.5.0 moviepy==1.0.3

    - name: Run Master AI Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_REFRESH_TOKEN_MYSTIC: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTIC }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: python main.py
