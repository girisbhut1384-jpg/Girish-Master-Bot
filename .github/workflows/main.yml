name: 24/7 AI Video Factory Pro

on:
  schedule:
    - cron: '0 */6 * * *' # हर 6 घंटे में शॉर्ट्स के लिए
    - cron: '30 16 * * *' # रात 10:00 PM IST पर लॉन्ग वीडियो के लिए (UTC 16:30)
  workflow_dispatch: # ताकि आप हाथ से भी चालू कर सकें

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # लॉन्ग वीडियो के रेंडरिंग के लिए पर्याप्त समय

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # इसे अपडेट कर दिया गया है

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          # ImageMagick की पॉलिसी को पूरी तरह खोलना
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-7/policy.xml || true

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests asyncio edge-tts moviepy==1.0.3 Pillow==9.5.0 google-api-python-client google-auth-oauthlib
          # वर्ज़न फिक्स कर दिए हैं ताकि कोई Error न आए

      - name: Run AI Video Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_MYSTIC: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTIC }}
        run: python main.py
