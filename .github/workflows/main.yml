name: YouTube Shorts Auto Uploader

on:
  schedule:
    - cron: '0 */6 * * *' # हर 6 घंटे में अपने आप चलेगा
  workflow_dispatch: # मैन्युअल (बटन दबाकर) चलाने के लिए

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests edge-tts moviepy pillow google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 urllib3==1.26.15

    - name: Run Video Generator Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_REFRESH_TOKEN_MYSTIC: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTIC }}
      run: python main.py
