name: Girish 24/7 Automation

on:
  schedule:
    # यह मशीन को हर 6 घंटे में चलाएगा (दिन में 4 बार) जिससे YouTube Limit Error नहीं आएगा
    - cron: '0 */6 * * *'
  workflow_dispatch: # आपको खुद बटन दबाकर चलाने की सुविधा देता है

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install Requirements
      run: pip install -r requirements.txt

    - name: Run Master Engine
      env:
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_REFRESH_TOKEN_MYSTIC: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTIC }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        AMAZON_ID: ${{ secrets.AMAZON_ID }}
      run: python main.py
