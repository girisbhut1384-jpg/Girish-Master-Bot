name: Auto YouTube Shorts Uploader V5

on:
  schedule:
    - cron: '0 */6 * * *' # हर 6 घंटे में ऑटोमैटिक चलेगा
  workflow_dispatch: # हाथ से रन (Run) का बटन दबाने के लिए

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install ImageMagick & Fix Policy (सबटाइटल्स के लिए बहुत जरूरी)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick
        # MoviePy को टेक्स्ट लिखने की परमिशन देने के लिए सिक्योरिटी पालिसी बदलना:
        sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Master AI Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_REFRESH_TOKEN_MYSTIC: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTIC }}
      run: python main.py
