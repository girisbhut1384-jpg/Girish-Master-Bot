name: Auto YouTube Shorts Generator

on:
  workflow_dispatch: # बटन दबाकर मैन्युअली चलाने के लिए
  # schedule:
  #   - cron: '0 4 * * *' # अगर भविष्य में रोज़ सुबह अपने आप चलाना हो

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Run Video Generator Script
      # 👇 यहीं पर असली जादू है: हम कोड को तिजोरी से चाबियां निकालने की परमिशन दे रहे हैं
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN_MYSTIC: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTIC }}
        YOUTUBE_TOKEN_EMPIRE: ${{ secrets.YOUTUBE_TOKEN_EMPIRE }}
        YOUTUBE_TOKEN_GADGET: ${{ secrets.YOUTUBE_TOKEN_GADGET }}
        YOUTUBE_TOKEN_HEALTH: ${{ secrets.YOUTUBE_TOKEN_HEALTH }}
        YOUTUBE_TOKEN_ZEROTOUCH: ${{ secrets.YOUTUBE_TOKEN_ZEROTOUCH }}
      run: python main.py
